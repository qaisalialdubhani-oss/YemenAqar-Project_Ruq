<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول للنظام</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
            <div class="container"><a class="navbar-brand" href="index.html">يمن <span class="text-warning">عقار</span></a></div>
        </nav>
    </header>

    <main class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-lg p-5 bg-white rounded-4">
                    <h2 class="fw-bold text-primary mb-4 text-center">تسجيل الدخول للمكاتب</h2>
                    <form class="needs-validation" novalidate>
                        <div class="mb-4">
                            <label class="form-label fw-bold fs-5">البريد الإلكتروني</label>
                            <input type="email" class="form-control form-control-lg" required>
                            <div class="invalid-feedback">يجب إدخال بريد إلكتروني صحيح.</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold fs-5">كلمة المرور</label>
                            <input type="password" class="form-control form-control-lg" minlength="8" required>
                            <div class="invalid-feedback">كلمة المرور يجب ألا تقل عن 8 أحرف.</div>
                        </div>
                        <button class="btn btn-primary btn-lg w-100 fw-bold py-3 fs-5" type="submit">دخول آمن للنظام <i class="fas fa-sign-in-alt ms-2"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center mt-auto py-3 bg-dark text-light"><div class="container"><p class="mb-0">&copy; 2026 يمن عقار</p></div></footer>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
